<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Workspace</title>
<style>
:root{--accent:#2f6fed;--bg:#fff;--bg2:#f6f6f4;--bg3:#efefec;--fg:#1f1f1d;--fg2:#55534e;--muted:#8a8882;--line:#e7e6e2;--red:#c9372c;--redbg:#fbe9e7;--amber:#a86b00;--amberbg:#fdf1d8;--green:#2b7a3d;--greenbg:#e3f3e6;--radius:10px}
[data-theme=dark]{--bg:#171717;--bg2:#1e1e1e;--bg3:#272727;--fg:#ececea;--fg2:#b4b2ac;--muted:#85837d;--line:#2f2f2f;--red:#ff8a7e;--redbg:#3d2220;--amber:#f0b84e;--amberbg:#3a2f14;--green:#79c98c;--greenbg:#1d3324}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);display:flex;min-height:100vh}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* sidebar */
aside{width:236px;background:var(--bg2);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px;font-weight:650;font-size:15px;letter-spacing:-.01em}
.brand .mark{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:#fff}
.brand .mark svg{width:13px;height:13px;stroke-width:2.2}
.sbox{position:relative;margin:0 0 10px}
.sbox svg{position:absolute;left:10px;top:9px;color:var(--muted);width:15px;height:15px}
.sbox input{padding-left:32px;background:var(--bg)}
nav{display:flex;flex-direction:column;gap:1px}
nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--fg2);cursor:pointer;font-weight:500}
nav a:hover{background:var(--bg3);color:var(--fg)}
nav a.on{background:var(--bg3);color:var(--fg)}
nav a.on svg{color:var(--accent)}
.grow{flex:1;min-width:0}
/* layout */
main{flex:1;padding:36px 44px 60px;max-width:1180px;min-width:0}
.head{margin-bottom:24px}
h2{margin:0;font-size:24px;font-weight:650;letter-spacing:-.02em;line-height:1.25}
.sub{color:var(--muted);margin-top:4px;font-size:14px}
h3.sec{margin:0 0 12px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
h3.sec .ct{background:var(--bg3);color:var(--fg2);border-radius:10px;padding:0 7px;font-size:11px;letter-spacing:0}
.block{margin-bottom:30px}
/* controls */
button,input,select,textarea{font:inherit;color:inherit}
button{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;border:1px solid transparent;border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:550;line-height:1.2}
button:hover{filter:brightness(1.06)}
button.ghost{background:var(--bg);color:var(--fg);border-color:var(--line)}
button.ghost:hover{background:var(--bg2);filter:none}
button.icon{padding:7px 9px}
button.danger{color:var(--red)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.bar select{width:auto}
/* cards & lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;background:var(--bg)}
.card.click{cursor:pointer;transition:border-color .12s,box-shadow .12s}
.card.click:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 1px 6px rgba(0,0,0,.05)}
.card .ti{font-weight:600;font-size:14.5px;line-height:1.35;margin-bottom:3px}
.me{color:var(--muted);font-size:12.5px;line-height:1.45}
.foot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px}
.panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:var(--bg2)}
.item .ti{font-weight:550;line-height:1.35}
.item .me{margin-top:1px}
.chk{width:20px;height:20px;padding:0;border-radius:50%;background:transparent;border:1.5px solid var(--muted);color:transparent;display:grid;place-items:center;flex:none}
.chk:hover{border-color:var(--accent);color:var(--accent);filter:none}
.chk.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chk svg{width:11px;height:11px;stroke-width:3}
.done .ti{text-decoration:line-through;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.time{background:var(--green)}
.when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;min-width:46px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:550;line-height:1.5;background:var(--bg3);color:var(--fg2);white-space:nowrap}
.tag svg{width:12px;height:12px}
.tag.alta{background:var(--redbg);color:var(--red)}.tag.media{background:var(--amberbg);color:var(--amber)}.tag.baixa{background:var(--greenbg);color:var(--green)}
.tag.late{background:var(--redbg);color:var(--red)}
.empty{color:var(--muted);padding:22px 16px;text-align:center;font-size:13.5px}
.panel .empty{padding:20px 16px}
/* dashboard */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:30px}
.stat{padding:16px 18px;border:1px solid var(--line);border-radius:var(--radius)}
.stat .lb{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;font-weight:550}
.stat b{display:block;font-size:30px;font-weight:650;letter-spacing:-.02em;line-height:1.15;margin-top:6px}
.stat.warn b{color:var(--red)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
.day{padding:8px 16px;background:var(--bg2);font-size:12px;font-weight:600;color:var(--fg2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.day.today{color:var(--accent)}
.prog{height:5px;border-radius:3px;background:var(--bg3);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
/* board */
.board{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:16px;align-items:start}
.col{background:var(--bg2);border-radius:var(--radius);padding:12px;min-height:140px}
.col h4{margin:2px 4px 12px;font-size:12px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between}
.col .card{margin-bottom:10px;padding:13px 14px;cursor:grab}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
/* table */
table{width:100%;border-collapse:separate;border-spacing:0}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);padding:8px 14px}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row:hover td{background:var(--bg2)}
/* dialog */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--fg);padding:24px;width:min(480px,92vw);box-shadow:0 20px 50px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 6px;font-size:17px;font-weight:650}
label{display:block;font-size:12.5px;font-weight:550;color:var(--fg2);margin:14px 0 5px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}
/* notes */
.notes{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;align-items:start}
.nlist .card{margin-bottom:10px;padding:13px 16px}
.nlist .card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.editor{border:1px solid var(--line);border-radius:var(--radius);padding:20px 24px}
.editor input.t{font-size:22px;font-weight:650;border:0;padding:4px 0;background:transparent;letter-spacing:-.01em}
.editor textarea{border:0;background:transparent;min-height:420px;resize:vertical;padding:6px 0;line-height:1.7;font-size:14.5px}
.editor input:focus,.editor textarea:focus{outline:none}
.editor .meta{display:flex;gap:10px;margin:8px 0 14px}
.editor .meta select{width:auto;min-width:160px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cal .h{padding:9px 10px;font-size:12px;font-weight:600;color:var(--muted);background:var(--bg2);border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.05em}
.cal .d{min-height:104px;padding:7px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;overflow:hidden}
.cal .d:nth-child(7n){border-right:0}
.cal .d:hover{background:var(--bg2)}.cal .d.out{background:var(--bg2);opacity:.55}
.cal .d .n{display:inline-grid;place-items:center;min-width:22px;height:22px;font-size:12.5px;color:var(--fg2);border-radius:11px;margin-bottom:3px}
.cal .d.today .n{background:var(--accent);color:#fff;font-weight:600}
.ev{font-size:12px;line-height:1.4;border-radius:5px;padding:2px 7px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.ev.task{background:color-mix(in srgb,var(--accent) 14%,var(--bg));color:color-mix(in srgb,var(--accent) 80%,var(--fg))}
.ev.event{background:var(--greenbg);color:var(--green)}
.ev.late{background:var(--redbg);color:var(--red)}
.legend{display:inline-flex;gap:14px;margin-left:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
@media(max-width:900px){.cols{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;height:auto;position:static}nav{flex-direction:row;flex-wrap:wrap}main{padding:22px 18px}.board{grid-template-columns:1fr}.notes{grid-template-columns:1fr}.cal .d{min-height:62px}}
</style>
</head>
<body>
<aside>
  <div class="brand"><span class="mark" id="mark"></span><span id="appName">Meu Workspace</span></div>
  <div class="sbox"><span id="sIcon"></span><input id="q" placeholder="Buscar…" oninput="search(this.value)"></div>
  <nav id="nav"></nav>
  <div class="grow"></div>
  <nav><a id="cfgLink"></a></nav>
</aside>
<main id="main"></main>
<dialog id="dlg"><form method="dialog" id="form"></form></dialog>

<script>
const P = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  tasks:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 5-6"/>',
  note:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  calendar:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>',
  sliders:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  pin:'<path d="M12 16v5M8 3h8l-1 6 3 4H6l3-4z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  left:'<path d="m15 18-6-6 6-6"/>', right:'<path d="m9 18 6-6-6-6"/>',
  alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
  board:'<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/>',
  check:'<path d="m5 12 4.5 4.5L19 7"/>',
  layers:'<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
};
const ic = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

const STATUS_T = {todo:'A fazer', doing:'Em andamento', done:'Concluída'};
const STATUS_P = {andamento:'Em andamento', pausado:'Pausado', concluido:'Concluído'};
const PRIO = {alta:'Alta', media:'Média', baixa:'Baixa'};
const S = {clients:[], projects:[], tasks:[], notes:[], events:[], noteId:null, cal:new Date(), q:'', view:'inicio', param:null, taskMode:'board', filter:{}};
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isoOf = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => isoOf(new Date());
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00'); d.setDate(d.getDate() + n); return isoOf(d); };
const fmt = (d) => d ? d.split('-').reverse().slice(0,2).join('/') : '—';
const late = (d, done) => d && !done && d < today();
function dayLabel(iso) {
  if (iso === today()) return 'Hoje'; if (iso === addDays(today(), 1)) return 'Amanhã';
  const w = new Date(iso + 'T12:00').toLocaleDateString('pt-BR', {weekday:'long'});
  return w.charAt(0).toUpperCase() + w.slice(1);
}

async function api(method, path, body) {
  const r = await fetch('/api/' + path, {method, headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
  if (!r.ok) throw new Error('Erro na API');
  return r.json();
}
async function load() {
  [S.clients, S.projects, S.tasks, S.notes, S.events] = await Promise.all(['clients','projects','tasks','notes','events'].map((t) => api('GET', t)));
  if (!document.activeElement?.closest?.('.editor')) render();
}
const client = (id) => S.clients.find((c) => c.id == id);
const project = (id) => S.projects.find((p) => p.id == id);
const ctx = (t) => { const p = project(t.project_id); return p ? [p.name, client(p.client_id)?.name].filter(Boolean).join(' · ') : 'Sem projeto'; };

/* ---------- personalização ---------- */
const cfg = Object.assign({name:'Meu Workspace', accent:'#2f6fed', theme:'light'}, JSON.parse(localStorage.getItem('cfg') || '{}'));
function applyCfg() {
  $('#appName').textContent = cfg.name; document.title = cfg.name;
  document.documentElement.style.setProperty('--accent', cfg.accent);
  document.documentElement.dataset.theme = cfg.theme;
  localStorage.setItem('cfg', JSON.stringify(cfg));
}
$('#mark').innerHTML = ic('layers'); $('#sIcon').innerHTML = ic('search');
$('#cfgLink').innerHTML = ic('sliders') + 'Personalizar';
$('#cfgLink').onclick = () => openForm('Personalizar', [
  {k:'name', l:'Nome do workspace', v:cfg.name},
  {k:'accent', l:'Cor de destaque', v:cfg.accent, type:'color'},
  {k:'theme', l:'Tema', v:cfg.theme, opts:{light:'Claro', dark:'Escuro'}},
], (v) => { Object.assign(cfg, v); applyCfg(); });

/* ---------- formulário genérico ---------- */
function openForm(title, fields, onSave, onDelete) {
  const f = $('#form');
  f.innerHTML = `<h3>${esc(title)}</h3>` + fields.map((x) => {
    const v = x.v ?? '';
    if (x.opts) return `<label>${x.l}</label><select name="${x.k}">${Object.entries(x.opts).map(([k,t]) => `<option value="${esc(k)}" ${k==v?'selected':''}>${esc(t)}</option>`).join('')}</select>`;
    if (x.type === 'textarea') return `<label>${x.l}</label><textarea name="${x.k}" rows="3">${esc(v)}</textarea>`;
    return `<label>${x.l}</label><input name="${x.k}" type="${x.type || 'text'}" value="${esc(v)}" ${x.req ? 'required' : ''}>`;
  }).join('') + `<div class="actions">${onDelete ? `<button type="button" class="ghost danger" id="del" style="margin-right:auto">${ic('trash')}Excluir</button>` : ''}<button type="button" class="ghost" id="cancel">Cancelar</button><button>Salvar</button></div>`;
  $('#cancel').onclick = () => $('#dlg').close();
  if (onDelete) $('#del').onclick = async () => { if (confirm('Excluir?')) { await onDelete(); $('#dlg').close(); load(); } };
  f.onsubmit = async (e) => { e.preventDefault(); const d = Object.fromEntries(new FormData(f)); await onSave(d); $('#dlg').close(); load(); };
  $('#dlg').showModal();
}
const opts = (list, key, empty = '— nenhum —') => Object.fromEntries([['', empty], ...list.map((x) => [x.id, x[key]])]);
const nul = (v) => v === '' ? null : Number(v);

function editClient(c = {}) {
  openForm(c.id ? 'Editar cliente' : 'Novo cliente', [
    {k:'name', l:'Nome', v:c.name, req:1}, {k:'email', l:'E-mail', v:c.email, type:'email'},
    {k:'phone', l:'Telefone', v:c.phone}, {k:'notes', l:'Notas', v:c.notes, type:'textarea'},
  ], (d) => c.id ? api('PUT','clients/'+c.id,d) : api('POST','clients',d), c.id && (() => api('DELETE','clients/'+c.id)));
}
function editProject(p = {}) {
  openForm(p.id ? 'Editar projeto' : 'Novo projeto', [
    {k:'name', l:'Nome', v:p.name, req:1}, {k:'client_id', l:'Cliente', v:p.client_id ?? '', opts:opts(S.clients,'name')},
    {k:'status', l:'Status', v:p.status || 'andamento', opts:STATUS_P}, {k:'deadline', l:'Data de entrega', v:p.deadline, type:'date'},
    {k:'description', l:'Descrição', v:p.description, type:'textarea'},
  ], (d) => { d.client_id = nul(d.client_id); return p.id ? api('PUT','projects/'+p.id,d) : api('POST','projects',d); }, p.id && (() => api('DELETE','projects/'+p.id)));
}
function editTask(t = {}) {
  openForm(t.id ? 'Editar tarefa' : 'Nova tarefa', [
    {k:'title', l:'Título', v:t.title, req:1}, {k:'project_id', l:'Projeto', v:t.project_id ?? (S.view==='projetos' ? S.param : '') ?? '', opts:opts(S.projects,'name')},
    {k:'status', l:'Status', v:t.status || 'todo', opts:STATUS_T}, {k:'priority', l:'Prioridade', v:t.priority || 'media', opts:PRIO},
    {k:'due', l:'Data', v:t.due, type:'date'}, {k:'notes', l:'Notas', v:t.notes, type:'textarea'},
  ], (d) => { d.project_id = nul(d.project_id); return t.id ? api('PUT','tasks/'+t.id,d) : api('POST','tasks',d); }, t.id && (() => api('DELETE','tasks/'+t.id)));
}
function editEvent(e = {}) {
  openForm(e.id ? 'Editar compromisso' : 'Novo compromisso', [
    {k:'title', l:'Título', v:e.title, req:1}, {k:'date', l:'Data', v:e.date, type:'date', req:1}, {k:'time', l:'Hora', v:e.time, type:'time'},
    {k:'project_id', l:'Projeto', v:e.project_id ?? '', opts:opts(S.projects,'name')}, {k:'notes', l:'Notas', v:e.notes, type:'textarea'},
  ], (d) => { d.project_id = nul(d.project_id); return e.id ? api('PUT','events/'+e.id,d) : api('POST','events',d); }, e.id && (() => api('DELETE','events/'+e.id)));
}
const taskById = (id) => S.tasks.find((x) => x.id == id), eventById = (id) => S.events.find((x) => x.id == id);

async function newNote(project_id = null, client_id = null) {
  const n = await api('POST','notes',{title:'Nova nota', project_id, client_id}); S.noteId = n.id; S.view = 'notas'; await load(); render();
}
let saveT;
function saveNote(id) {
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    const g = (k) => $('#n_' + k).value, v = {title:g('title'), content:g('content'), project_id:nul(g('project_id')), client_id:nul(g('client_id'))};
    await api('PUT','notes/'+id, v);
    Object.assign(S.notes.find((x) => x.id == id), v);
    const t = document.querySelector(`.nlist [data-n="${id}"] .ti`); if (t) t.textContent = v.title || 'Sem título';
    $('#saved').textContent = 'Salvo';
  }, 500);
  $('#saved').textContent = 'Salvando…';
}
async function togglePin(id) { const n = S.notes.find((x) => x.id == id); await api('PUT','notes/'+id,{pinned:n.pinned?0:1}); load(); }
async function delNote(id) { if (!confirm('Excluir esta nota?')) return; await api('DELETE','notes/'+id); S.noteId = null; load(); }
function search(v) { S.q = v.trim(); if (S.q) S.view = 'busca'; else if (S.view === 'busca') S.view = 'inicio'; render(); }
function calMove(d) { S.cal = new Date(S.cal.getFullYear(), S.cal.getMonth() + d, 1); render(); }
async function setStatus(id, status) { await api('PUT','tasks/'+id,{status}); load(); }
const go = (v, p = null) => { S.view = v; S.param = p; render(); };

/* ---------- componentes ---------- */
const NAV = [['inicio','home','Início'],['projetos','folder','Projetos'],['tarefas','tasks','Tarefas'],['notas','note','Notas'],['calendario','calendar','Calendário'],['prazos','clock','Entregas'],['clientes','users','Clientes']];
const head = (t, s, right = '') => `<div class="head" style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap"><div><h2>${t}</h2><div class="sub">${s}</div></div><div class="bar" style="margin:0">${right}</div></div>`;
const dateTag = (d, done) => d ? `<span class="tag ${late(d, done) ? 'late' : ''}">${ic('calendar')}${fmt(d)}</span>` : '';
const prioTag = (p) => `<span class="tag ${p}">${PRIO[p]}</span>`;
const sec = (t, n) => `<h3 class="sec">${t}${n != null ? `<span class="ct">${n}</span>` : ''}</h3>`;

const taskCard = (t) => `<div class="card click" draggable="true" data-id="${t.id}" onclick="editTask(taskById(${t.id}))">
  <div class="ti ${t.status==='done'?'done':''}" ${t.status==='done'?'style="text-decoration:line-through;color:var(--muted)"':''}>${esc(t.title)}</div>
  <div class="me">${esc(ctx(t))}</div>
  <div class="foot">${prioTag(t.priority)}${dateTag(t.due, t.status==='done')}</div></div>`;

const taskRow = (t, showDate = true) => `<div class="item ${t.status==='done'?'done':''}" onclick="editTask(taskById(${t.id}))">
  <button class="chk ${t.status==='done'?'on':''}" title="Concluir" onclick="event.stopPropagation();setStatus(${t.id},'${t.status==='done'?'todo':'done'}')">${ic('check')}</button>
  <div class="grow"><div class="ti">${esc(t.title)}</div><div class="me">${esc(ctx(t))}</div></div>
  ${prioTag(t.priority)}${showDate ? dateTag(t.due, t.status==='done') : ''}</div>`;
const panel = (rows, empty) => `<div class="panel">${rows.length ? rows.join('') : `<div class="empty">${empty}</div>`}</div>`;

function board(ts) {
  return `<div class="board">${Object.entries(STATUS_T).map(([k,l]) => { const c = ts.filter(t=>t.status===k);
    return `<div class="col" data-status="${k}"><h4><span>${l}</span><span>${c.length}</span></h4>${c.map(taskCard).join('')}</div>`; }).join('')}</div>`;
}
function list(ts) {
  return `<div class="panel">${ts.length ? ts.map((t) => taskRow(t)).join('') : '<div class="empty">Nenhuma tarefa.</div>'}</div>`;
}

/* ---------- views ---------- */
const views = {
  inicio() {
    const t0 = today(), open = S.tasks.filter((t) => t.status !== 'done');
    const overdue = open.filter((t) => late(t.due)).sort((a,b) => a.due.localeCompare(b.due));
    const dueToday = open.filter((t) => t.due === t0);
    const undated = open.filter((t) => !t.due);
    const doing = open.filter((t) => t.status === 'doing');
    const pending = open.length;
    const end = addDays(t0, 7);
    // agenda dos próximos 7 dias: tarefas + compromissos
    const days = {};
    open.filter((t) => t.due && t.due >= t0 && t.due <= end).forEach((t) => (days[t.due] ||= []).push({k:'t', time:'', t}));
    S.events.filter((e) => e.date >= t0 && e.date <= end).forEach((e) => (days[e.date] ||= []).push({k:'e', time:e.time || '', e}));
    const agenda = Object.keys(days).sort().map((d) => `<div class="day ${d===t0?'today':''}"><span>${dayLabel(d)}</span><span>${fmt(d)}</span></div>` +
      days[d].sort((a,b) => (a.time || '99').localeCompare(b.time || '99')).map((x) => x.k === 't' ? taskRow(x.t, false)
        : `<div class="item" onclick="editEvent(eventById(${x.e.id}))"><span class="dot time"></span><div class="grow"><div class="ti">${esc(x.e.title)}</div><div class="me">Compromisso${x.e.project_id ? ' · ' + esc(project(x.e.project_id)?.name || '') : ''}</div></div><span class="when">${esc(x.e.time) || 'Dia todo'}</span></div>`).join(''));
    const active = S.projects.filter((p) => p.status === 'andamento');
    const pinned = S.notes.filter((n) => n.pinned);
    return `${head('Início', new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}).replace(/^./, (c)=>c.toUpperCase()), '')}
    <div class="stats">
      <div class="stat ${overdue.length?'warn':''}"><div class="lb">${ic('alert')}Atrasadas</div><b>${overdue.length}</b></div>
      <div class="stat"><div class="lb">${ic('calendar')}Para hoje</div><b>${dueToday.length + S.events.filter(e=>e.date===t0).length}</b></div>
      <div class="stat"><div class="lb">${ic('tasks')}Pendentes</div><b>${pending}</b></div>
      <div class="stat"><div class="lb">${ic('folder')}Projetos ativos</div><b>${active.length}</b></div>
    </div>
    <div class="cols">
      <div>
        ${overdue.length ? `<div class="block">${sec('Atrasadas', overdue.length)}${panel(overdue.map((t) => taskRow(t)))}</div>` : ''}
        <div class="block">${sec('Próximos 7 dias')}<div class="panel">${agenda.length ? agenda.join('') : '<div class="empty">Nada agendado para os próximos 7 dias.</div>'}</div></div>
        <div class="block">${sec('Em andamento', doing.length)}${panel(doing.map((t) => taskRow(t)), 'Nenhuma tarefa em andamento.')}</div>
      </div>
      <div>
        <div class="block">${sec('Sem data, organizar na agenda', undated.length)}${panel(undated.slice(0,8).map((t) => taskRow(t, false)), 'Todas as tarefas têm data.')}</div>
        <div class="block">${sec('Projetos ativos', active.length)}${panel(active.map((p) => { const ts = S.tasks.filter(t=>t.project_id==p.id), d = ts.filter(t=>t.status==='done').length, pc = ts.length ? Math.round(d/ts.length*100) : 0;
          return `<div class="item" style="display:block" onclick="go('projetos',${p.id})"><div style="display:flex;justify-content:space-between;gap:10px"><div class="ti">${esc(p.name)}</div><span class="me">${d}/${ts.length}</span></div><div class="me">${esc(client(p.client_id)?.name || 'Sem cliente')}${p.deadline ? ' · entrega ' + fmt(p.deadline) : ''}</div><div class="prog"><i style="width:${pc}%"></i></div></div>`; }), 'Nenhum projeto ativo.')}</div>
        ${pinned.length ? `<div class="block">${sec('Notas fixadas', pinned.length)}${panel(pinned.map((n) => `<div class="item" onclick="S.noteId=${n.id};go('notas')">${ic('note')}<div class="grow"><div class="ti">${esc(n.title || 'Sem título')}</div><div class="me">${esc(n.content.slice(0,70))}</div></div></div>`))}</div>` : ''}
      </div>
    </div>`;
  },
  projetos() {
    if (S.param) return views.projeto(S.param);
    return `${head('Projetos', 'Todos os projetos e o andamento de cada um.', `<button onclick="editProject()">${ic('plus')}Novo projeto</button>`)}
    <div class="grid">${S.projects.map((p) => {
      const ts = S.tasks.filter((t) => t.project_id == p.id), d = ts.filter((t) => t.status==='done').length, pc = ts.length ? Math.round(d/ts.length*100) : 0;
      return `<div class="card click" onclick="go('projetos',${p.id})"><div class="ti">${esc(p.name)}</div>
      <div class="me">${esc(client(p.client_id)?.name || 'Sem cliente')}</div>
      <div class="prog"><i style="width:${pc}%"></i></div>
      <div class="foot"><span class="tag">${STATUS_P[p.status]}</span>${p.deadline ? `<span class="tag ${late(p.deadline,p.status==='concluido')?'late':''}">${ic('clock')}Entrega ${fmt(p.deadline)}</span>` : ''}<span class="me" style="margin-left:auto">${d}/${ts.length} tarefas</span></div></div>`; }).join('') || '<div class="empty" style="grid-column:1/-1">Nenhum projeto ainda.</div>'}</div>`;
  },
  projeto(id) {
    const p = project(id); if (!p) { S.param = null; return views.projetos(); }
    const ts = S.tasks.filter((t) => t.project_id == id), ns = S.notes.filter((n) => n.project_id == id);
    return `<div class="bar"><button class="ghost" onclick="go('projetos')">${ic('left')}Projetos</button></div>
    ${head(esc(p.name), `${esc(client(p.client_id)?.name || 'Sem cliente')} · ${STATUS_P[p.status]}${p.deadline ? ' · entrega ' + fmt(p.deadline) : ''}`,
      `<button class="ghost" onclick="editProject(project(${id}))">Editar</button><button onclick="editTask()">${ic('plus')}Nova tarefa</button>`)}
    ${p.description ? `<p style="margin:-6px 0 24px;color:var(--fg2);max-width:70ch">${esc(p.description)}</p>` : ''}
    <div class="block">${sec('Tarefas', ts.length)}${board(ts)}</div>
    <div class="block">${sec('Notas', ns.length)}<div class="bar"><button class="ghost" onclick="newNote(${id})">${ic('plus')}Nota neste projeto</button></div>
    <div class="grid">${ns.map((n) => `<div class="card click" onclick="S.noteId=${n.id};go('notas')"><div class="ti">${esc(n.title||'Sem título')}</div><div class="me">${esc(n.content.slice(0,90))}</div></div>`).join('') || '<div class="empty" style="grid-column:1/-1">Sem notas.</div>'}</div></div>`;
  },
  tarefas() {
    const f = S.filter, ts = S.tasks.filter((t) => (!f.project || t.project_id == f.project) && (!f.client || project(t.project_id)?.client_id == f.client));
    const sel = (key, list, all) => `<select onchange="S.filter.${key}=this.value;render()">${Object.entries(opts(list,'name',all)).map(([k,v]) => `<option value="${k}" ${k==(f[key]||'')?'selected':''}>${esc(v)}</option>`).join('')}</select>`;
    return `${head('Tarefas', S.taskMode==='board' ? 'Arraste os cartões entre as colunas para mudar o status.' : 'Marque as tarefas conforme concluir.',
      `${sel('project', S.projects, 'Todos os projetos')}${sel('client', S.clients, 'Todos os clientes')}<button class="ghost" onclick="S.taskMode=S.taskMode==='board'?'list':'board';render()">${ic(S.taskMode==='board'?'list':'board')}${S.taskMode==='board'?'Lista':'Quadro'}</button><button onclick="editTask()">${ic('plus')}Nova tarefa</button>`)}
    ${S.taskMode==='board' ? board(ts) : list(ts)}`;
  },
  notas() {
    const ns = [...S.notes].sort((a,b) => (b.pinned - a.pinned) || b.updated.localeCompare(a.updated));
    if (!S.noteId || !S.notes.find((n) => n.id == S.noteId)) S.noteId = ns[0]?.id ?? null;
    const n = S.notes.find((x) => x.id == S.noteId);
    const sel = (k, list, all) => `<select id="n_${k}" onchange="saveNote(${n?.id})">${Object.entries(opts(list,'name',all)).map(([v,t]) => `<option value="${v}" ${v==(n?.[k]??'')?'selected':''}>${esc(t)}</option>`).join('')}</select>`;
    return `${head('Notas', 'Ideias, reuniões e briefings. Tudo é salvo automaticamente.', `<button onclick="newNote()">${ic('plus')}Nova nota</button>`)}
    <div class="notes"><div class="nlist">
      ${ns.map((x) => `<div class="card click ${x.id==S.noteId?'sel':''}" data-n="${x.id}" onclick="S.noteId=${x.id};render()"><div class="ti">${esc(x.title||'Sem título')}</div><div class="me">${x.pinned?'Fixada · ':''}${esc(project(x.project_id)?.name || client(x.client_id)?.name || x.content.slice(0,40) || 'Vazia')}</div></div>`).join('') || '<div class="empty">Nenhuma nota.</div>'}</div>
    ${n ? `<div class="editor"><div class="bar" style="margin-bottom:6px"><span class="me" id="saved"></span><span class="grow"></span><button class="ghost" onclick="togglePin(${n.id})">${ic('pin')}${n.pinned?'Desafixar':'Fixar'}</button><button class="ghost danger icon" title="Excluir" onclick="delNote(${n.id})">${ic('trash')}</button></div>
      <input class="t" id="n_title" value="${esc(n.title)}" placeholder="Título" oninput="saveNote(${n.id})">
      <div class="meta">${sel('project_id', S.projects, 'Sem projeto')}${sel('client_id', S.clients, 'Sem cliente')}</div>
      <textarea id="n_content" placeholder="Escreva aqui…" oninput="saveNote(${n.id})">${esc(n.content)}</textarea></div>` : '<div class="empty">Crie sua primeira nota.</div>'}</div>`;
  },
  calendario() {
    const y = S.cal.getFullYear(), m = S.cal.getMonth(), first = new Date(y, m, 1), start = new Date(y, m, 1 - first.getDay());
    const by = {}, add = (d, o) => d && (by[d] ||= []).push(o);
    // só tarefas e compromissos; projetos não entram no calendário
    S.tasks.filter((t) => t.status !== 'done').forEach((t) => add(t.due, {c: late(t.due) ? 'task late' : 'task', t: t.title, f: `editTask(taskById(${t.id}))`}));
    S.events.forEach((e) => add(e.date, {c:'event', t:(e.time ? e.time + ' ' : '') + e.title, f: `editEvent(eventById(${e.id}))`, s:e.time || ''}));
    let cells = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map((d) => `<div class="h">${d}</div>`).join('');
    for (let i = 0; i < 42; i++) { const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), k = isoOf(d);
      cells += `<div class="d ${d.getMonth()!==m?'out':''} ${k===today()?'today':''}" onclick="editEvent({date:'${k}'})"><span class="n">${d.getDate()}</span>${(by[k]||[]).map((o) => `<div class="ev ${o.c}" title="${esc(o.t)}" onclick="event.stopPropagation();${o.f}">${esc(o.t)}</div>`).join('')}</div>`; }
    const label = first.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
    return `${head('Calendário', `Tarefas e compromissos. Clique em um dia para adicionar um compromisso. <span class="legend"><span><i style="background:color-mix(in srgb,var(--accent) 40%,var(--bg))"></i>Tarefa</span><span><i style="background:var(--green)"></i>Compromisso</span></span>`,
      `<button class="ghost icon" onclick="calMove(-1)">${ic('left')}</button><b style="min-width:140px;text-align:center;text-transform:capitalize">${label}</b><button class="ghost icon" onclick="calMove(1)">${ic('right')}</button><button class="ghost" onclick="S.cal=new Date();render()">Hoje</button>`)}
    <div class="cal">${cells}</div>`;
  },
  busca() {
    const q = S.q.toLowerCase(), has = (...v) => v.some((x) => String(x ?? '').toLowerCase().includes(q));
    const grp = (t, a) => a.length ? `<div class="block">${sec(t, a.length)}<div class="grid">${a.join('')}</div></div>` : '';
    const card = (h, m, f) => `<div class="card click" onclick="${f}"><div class="ti">${esc(h)}</div><div class="me">${esc(m)}</div></div>`;
    const out = grp('Projetos', S.projects.filter((p) => has(p.name,p.description)).map((p) => card(p.name, client(p.client_id)?.name||'', `go('projetos',${p.id})`)))
      + grp('Tarefas', S.tasks.filter((t) => has(t.title,t.notes)).map((t) => card(t.title, ctx(t), `editTask(taskById(${t.id}))`)))
      + grp('Notas', S.notes.filter((n) => has(n.title,n.content)).map((n) => card(n.title||'Sem título', n.content.slice(0,80), `S.noteId=${n.id};S.q='';$('#q').value='';go('notas')`)))
      + grp('Clientes', S.clients.filter((c) => has(c.name,c.email,c.notes)).map((c) => card(c.name, c.email, `editClient(client(${c.id}))`)))
      + grp('Compromissos', S.events.filter((e) => has(e.title,e.notes)).map((e) => card(e.title, fmt(e.date), `editEvent(eventById(${e.id}))`)));
    return `${head('Busca', `Resultados para “${esc(S.q)}”`)}${out || '<div class="empty">Nada encontrado.</div>'}`;
  },
  prazos() {
    const items = S.projects.filter((p) => p.deadline && p.status !== 'concluido').map((p) => ({d:p.deadline, name:p.name, sub:client(p.client_id)?.name, late:late(p.deadline), f:`go('projetos',${p.id})`})).sort((a,b) => a.d.localeCompare(b.d));
    return `${head('Entregas', 'Data de entrega de cada projeto em andamento. Compromissos e tarefas ficam no calendário.')}
    <div class="panel">${items.map((i) => `<div class="item" onclick="${i.f}"><div class="grow"><div class="ti">${esc(i.name)}</div><div class="me">${esc(i.sub || 'Sem cliente')}</div></div>${dateTag(i.d)}</div>`).join('') || '<div class="empty">Nenhuma entrega definida.</div>'}</div>`;
  },
  clientes() {
    return `${head('Clientes', 'Quem você atende e os projetos de cada um.', `<button onclick="editClient()">${ic('plus')}Novo cliente</button>`)}
    <div class="grid">${S.clients.map((c) => { const ps = S.projects.filter((p) => p.client_id == c.id);
      return `<div class="card click" onclick="editClient(client(${c.id}))"><div class="ti">${esc(c.name)}</div><div class="me">${esc([c.email, c.phone].filter(Boolean).join(' · ') || 'Sem contato')}</div>
      <div class="foot">${ps.map((p) => `<span class="tag">${esc(p.name)}</span>`).join('') || '<span class="me">Sem projetos</span>'}</div></div>`; }).join('') || '<div class="empty" style="grid-column:1/-1">Nenhum cliente ainda.</div>'}</div>`;
  },
};

function render() {
  $('#nav').innerHTML = NAV.map(([k,i,l]) => `<a class="${S.view===k?'on':''}" onclick="go('${k}')">${ic(i)}${l}</a>`).join('');
  $('#main').innerHTML = views[S.view]();
  document.querySelectorAll('[draggable]').forEach((el) => el.ondragstart = (e) => e.dataTransfer.setData('id', el.dataset.id));
  document.querySelectorAll('.col').forEach((c) => {
    c.ondragover = (e) => { e.preventDefault(); c.classList.add('over'); };
    c.ondragleave = () => c.classList.remove('over');
    c.ondrop = (e) => { e.preventDefault(); c.classList.remove('over'); setStatus(e.dataTransfer.getData('id'), c.dataset.status); };
  });
}
applyCfg(); load();
</script>
</body>
</html>
